name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Create release archive
        run: |
          TAG="${{ github.ref_name }}"
          ARCHIVE="marvin-${TAG}.tar.gz"
          tar -czf "$ARCHIVE" \
            --exclude='node_modules' \
            --exclude='.git' \
            --exclude='*.test.ts' \
            --exclude='*.mock.ts' \
            .

      - name: Create GitHub Release
        run: |
          TAG="${{ github.ref_name }}"
          ARCHIVE="marvin-${TAG}.tar.gz"
          gh release create "$TAG" \
            "$ARCHIVE" \
            --title "$TAG" \
            --generate-notes
